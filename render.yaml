services:
  - type: web
    name: dnd-wilderweb
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build
    startCommand: npm start
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: SITE_USER
        sync: false
